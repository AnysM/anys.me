backend:
  name: github
  repo: AnysM/anys.me
  branch: refonte

site_url: https://refonte--anysme.netlify.app
display_url: https://refonte--anysme.netlify.app
media_folder: "public/img"
public_folder: "/img"

collections:
  - name: agenda
    label: "Agenda — événements"
    label_singular: "un événement"
    folder: "src/content/agenda"
    create: true
    slug: "{{slug}}"
    summary: "{{titre}}"
    fields:
      - { name: titre, label: "Titre", widget: string }
      - { name: categorie, label: "Catégorie", widget: select, options: ["soin", "atelier", "retraite", "immersion", "voyage-sonore", "accompagnement", "cercle", "residence"] }
      - { name: date, label: "Date", widget: datetime, required: false, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { name: date_fin, label: "Date de fin", widget: datetime, required: false, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { name: rythme, label: "Rythme (si pas de date)", widget: string, required: false, hint: "Ex : Tous les dimanches à 19h" }
      - { name: heure, label: "Heure", widget: string, required: false }
      - { name: lieu, label: "Lieu", widget: string, required: false }
      - { name: prix, label: "Prix", widget: string, required: false }
      - { name: earlybird, label: "Early bird — date limite", widget: string, required: false, hint: "Ex : 10 octobre" }
      - { name: cta, label: "Texte du bouton", widget: string, required: false, hint: "Ex : Candidater, Réserver" }
      - { name: site, label: "Lien direct de la carte", widget: string, required: false, hint: "Renseigner si la carte doit mener directement à un site externe ou une page" }
      - { name: lien, label: "Lien de réservation", widget: string, required: false }
      - { name: resume, label: "Résumé (proposition de valeur)", widget: text }
      - { name: image, label: "Image", widget: image, required: false, choose_url: false }
      - { name: reservable, label: "Réservable", widget: boolean, default: false }
      - { name: ordre, label: "Ordre d'affichage", widget: number, default: 10, value_type: int }
      - { name: publie, label: "Publié", widget: boolean, default: true }
      - { name: body, label: "Contenu de la page", widget: markdown, required: false }

  - name: offres
    label: "Soins & accompagnement"
    label_singular: "une offre"
    folder: "src/content/offres"
    create: true
    slug: "{{slug}}"
    summary: "{{titre}}"
    fields:
      - { name: titre, label: "Titre", widget: string }
      - { name: categorie, label: "Catégorie", widget: select, options: ["soin", "accompagnement"] }
      - { name: tag, label: "Étiquette", widget: string, required: false, hint: "Ex : Massage, Soin énergétique" }
      - { name: resume, label: "Résumé (proposition de valeur)", widget: text }
      - { name: prix, label: "Prix", widget: string, required: false }
      - { name: duree, label: "Durée", widget: string, required: false }
      - { name: format, label: "Format", widget: string, required: false }
      - name: tarifs
        label: "Tarifs (formules)"
        widget: list
        required: false
        summary: "{{fields.label}} — {{fields.prix}}"
        fields:
          - { name: label, label: "Formule", widget: string }
          - { name: prix, label: "Prix", widget: string }
          - { name: detail, label: "Détail", widget: string, required: false }
      - { name: image, label: "Image", widget: image, required: false, choose_url: false }
      - { name: lien, label: "Lien", widget: string, required: false }
      - { name: reservable, label: "Réservable", widget: boolean, default: true }
      - { name: ordre, label: "Ordre d'affichage", widget: number, default: 10, value_type: int }
      - { name: publie, label: "Publié", widget: boolean, default: true }
      - { name: body, label: "Contenu de la page", widget: markdown, required: false }
